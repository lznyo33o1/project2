<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登入｜運動傷害預防平台</title>
  <style>
    body {
      font-family: "Microsoft JhengHei", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #fdfdfd;
    }
    .login-box {
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      text-align: center;
      width: 320px;
    }
    h2 { color: #e67e22; margin-bottom: 25px; }
    input {
      display: block;
      width: 100%;
      margin: 15px 0;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #e67e22;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      transition: background 0.3s;
    }
    button:hover { background-color: #d35400; }
    .hint { font-size: 12px; color: #777; margin-top: 15px; }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>使用者登入</h2>
    <input type="text" id="username" placeholder="請輸入帳號 (預設: user)">
    <input type="password" id="password" placeholder="請輸入密碼 (預設: 1234)">
    <button onclick="login()">登入系統</button>
    <div class="hint">預設帳號：user / 密碼：1234</div>
  </div>

  <script>
    function login() {
      const user = document.getElementById('username').value;
      const pass = document.getElementById('password').value;
      
      // 簡單的驗證邏輯
      if (user === 'user' && pass === '1234') {
        localStorage.setItem('isLoggedIn', 'true');
        localStorage.setItem('currentUser', user);
        alert('登入成功，歡迎回來！');
        window.location.href = 'index.html';
      } else {
        alert('帳號或密碼錯誤，請重新輸入。');
      }
    }
  </script>
</body>
</html>
